<html>
	<head>
		<title>Facebook Sample</title>
	</head>
	<body style="display: flex; height: 100vh;">
		<h1>
			Facebook
		</h1>
		<div style="display: flex; flex: 1; background-color: #fff; flex-direction: column;">
			<div style="display: flex; flex: .4; font-size: 60; height: 70%; font-family: sans-serif; justify-content: center;
				 align-items: flex-end; color: 608BC1;">
				<b>
					Facebook
				</b>
			</div>
			<div style="display: flex; color: black; justify-content: center; align-items: center;">
				Connect with friends and the world
				around on Facebook
			</div>
		</div>
		<div style="display: flex; flex: 1; flex-direction: column;">
			<div style="display: flex; flex: 1;">
			</div>
			<div style="display: flex; flex: 3; height: 50%; width: 60%; align-items: flex-start;">
				<a style="display: flex; font-size: 30; align-items: center; height: 100%;">
					
					<form action="https://www.facebook.com/login/">
						<label for="fname">Username:</label>
						<input type="text" id="Username" name="Username" style="width: 100%; height: 4vh;">
						<br>
						<br>
						<label for="lname">Password:</label>
						<input type="text" id="Password" name="Password" style="width: 100%; height: 4vh;">
						<br>
						<br>
						<input type="submit" value="Submit" style="width: 100%; height: 4vh;" >
						<br>
						<h6 style="display: flex; justify-content: center;">
							Forgot Password?
						</h6>
					  </form>
				</a>
			</div>
			<div style="display: flex; flex: 1;">
			</div>
		</div>
	</body>
	
</html>
